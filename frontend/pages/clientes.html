<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMU — Clientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<script src="db.js"></script><script src="layout.js"></script>
<script>if(!Auth.exigir())throw''; renderLayout('clientes.html');</script>
<script>
const C = document.getElementById('conteudo');
let filtro = '';

async function render() {
  C.innerHTML = skeletonTable(5);
  let lista = await DB.Clientes.listar();
  lista = (lista || []).slice().reverse();
  if (filtro) {
    lista = lista.filter(c =>
      c.nome.toLowerCase().includes(filtro) ||
      (c.cpfCnpj||'').toLowerCase().includes(filtro) ||
      (c.email||'').toLowerCase().includes(filtro) ||
      (c.telefone||'').toLowerCase().includes(filtro)
    );
  }

  C.innerHTML = `
    <div class="mb-4">${kpiCard({ icon: 'people', label: 'Clientes cadastrados', value: lista.length, iconColor: 'text-[#ffb4ac]' })}</div>
    ${pageToolbar(
      `<input id="busca" type="text" placeholder="Buscar..." value="${esc(filtro)}" class="input-busca" onkeydown="if(event.key==='Enter'){filtro=this.value.toLowerCase();render();}"/>`,
      `<button type="button" onclick="abrirForm()" class="btn-primary"><span class="material-symbols-outlined text-base">person_add</span>Novo Cliente</button>`
    )}
    <div class="panel table-wrap">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-[#484848]/30 text-[10px] text-[#acabaa] uppercase tracking-wider">
            <th class="px-4 py-3 text-left">Nome</th>
            <th class="px-4 py-3 text-left">CPF / CNPJ</th>
            <th class="px-4 py-3 text-left">Telefone</th>
            <th class="px-4 py-3 text-left">E-mail</th>
            <th class="px-4 py-3 text-left">Endereço</th>
            <th class="px-4 py-3 text-left">Cadastro</th>
            <th class="px-4 py-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${lista.length ? lista.map(c => `
            <tr class="border-b border-[#484848]/10 last:border-0">
              <td class="px-4 py-3 font-semibold text-white">${esc(c.nome)}</td>
              <td class="px-4 py-3 text-[#acabaa] font-mono text-xs">${esc(c.cpfCnpj)||'—'}</td>
              <td class="px-4 py-3 text-[#acabaa]">${esc(c.telefone)||'—'}</td>
              <td class="px-4 py-3 text-[#acabaa]">${esc(c.email)||'—'}</td>
              <td class="px-4 py-3 text-[#acabaa] text-xs max-w-xs truncate">${esc(c.endereco)||'—'}</td>
              <td class="px-4 py-3 text-xs text-[#acabaa]">${fmtData(c.criadoEm)}</td>
              <td class="px-4 py-3 text-center">
                <div class="flex items-center justify-center gap-1">
                  <button onclick="abrirForm(${c.id})" title="Editar" class="p-1 text-[#acabaa] hover:text-[#ffb4ac] transition-colors"><span class="material-symbols-outlined text-base">edit</span></button>
                </div>
              </td>
            </tr>`).join('') : `<tr><td colspan="7">${emptyState('Nenhum cliente cadastrado.', 'people')}</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

async function abrirForm(id) {
  const c = id ? await DB.Clientes.buscar(id) : {};
  const conteudo = `
    <div class="grid grid-cols-2 gap-4">
      ${campo('Nome Completo', 'f-nome', 'text', c.nome||'')}
      ${campo('CPF / CNPJ', 'f-cpfcnpj', 'text', c.cpfCnpj||'')}
      ${campo('Telefone', 'f-telefone', 'tel', c.telefone||'')}
      ${campo('E-mail', 'f-email', 'email', c.email||'')}
    </div>
    ${campo('Endereço Completo', 'f-endereco', 'text', c.endereco||'')}`;

  abrirModal(id ? 'Editar Cliente' : 'Novo Cliente', conteudo, async () => {
    const dados = {
      nome: val('f-nome'), cpfCnpj: val('f-cpfcnpj'),
      telefone: val('f-telefone'), email: val('f-email'), endereco: val('f-endereco')
    };
    if (!dados.nome) { toast('Nome é obrigatório.', 'err'); return false; }
    try {
      if (id) { await DB.Clientes.atualizar(id, dados); toast('Cliente atualizado!'); }
      else { await DB.Clientes.criar(dados); toast('Cliente cadastrado!'); }
      render();
      return true;
    } catch (e) {
      toast(e.message, 'err');
      return false;
    }
  });
}



render().catch(console.error);
</script>
</body>
</html>
