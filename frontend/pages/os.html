<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMU — Ordens de Serviço</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<script src="db.js"></script><script src="layout.js"></script>
<script>if(!Auth.exigir())throw''; renderLayout('os.html');</script>
<script>
const C = document.getElementById('conteudo');
let filtro = '';
let filtroStatus = getQueryParam('status') || '';
let pecasSelecionadasTemp = [];

window.setFiltroStatus = function (s) {
  filtroStatus = s;
  const url = new URL(window.location.href);
  if (s) url.searchParams.set('status', s);
  else url.searchParams.delete('status');
  window.history.replaceState({}, '', url);
  render();
};

async function render() {
  C.innerHTML = skeletonTable(6);
  let lista = filtroStatus ? await DB.OS.listar(filtroStatus) : await DB.OS.listar();
  lista = (lista || []).slice().reverse();
  if (filtro) {
    lista = lista.filter(o =>
      (o.numero||'').toLowerCase().includes(filtro) ||
      (o.cliente||'').toLowerCase().includes(filtro) ||
      (o.veiculo||'').toLowerCase().includes(filtro) ||
      (o.placa||'').toLowerCase().includes(filtro) ||
      (o.servico||'').toLowerCase().includes(filtro)
    );
  }

  const chips = chipsHtml([
    ['', 'Todas'],
    ['pendente', 'Pendentes'],
    ['em_execucao', 'Em execução'],
    ['finalizado', 'Finalizadas'],
    ['cancelado', 'Canceladas'],
  ], filtroStatus, 'setFiltroStatus');

  C.innerHTML = `
    ${chips}
    ${pageToolbar(
      `<input id="busca" type="text" placeholder="Buscar..." value="${esc(filtro)}" class="input-busca" onkeydown="if(event.key==='Enter'){filtro=this.value.toLowerCase();render();}"/><span class="text-xs text-[#acabaa] ml-2">${lista.length} resultado(s)</span>`,
      `<button type="button" onclick="abrirForm()" class="btn-primary"><span class="material-symbols-outlined text-base">add</span>Nova OS</button>`
    )}
    <div class="panel table-wrap">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-[#484848]/30 text-[10px] text-[#acabaa] uppercase tracking-wider">
            <th class="px-4 py-3 text-left">Número</th>
            <th class="px-4 py-3 text-left">Cliente / Veículo</th>
            <th class="px-4 py-3 text-left">Serviço</th>
            <th class="px-4 py-3 text-left">Técnico</th>
            <th class="px-4 py-3 text-left">Prioridade</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-left">Criado</th>
            <th class="px-4 py-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${lista.length ? lista.map(o => `
            <tr class="border-b border-[#484848]/10 last:border-0 cursor-pointer" onclick="verDetalhes(${o.id})">
              <td class="px-4 py-3 font-bold text-[#ffb4ac]">${esc(o.numero)}</td>
              <td class="px-4 py-3"><div class="font-semibold text-white">${esc(o.cliente)}</div><div class="text-xs text-[#acabaa]">${esc(o.veiculo)} ${o.placa?'· '+o.placa:''}</div></td>
              <td class="px-4 py-3 text-[#acabaa]">${esc(o.servico)}</td>
              <td class="px-4 py-3 text-[#acabaa]">${esc(o.tecnico)||'—'}</td>
              <td class="px-4 py-3"><span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${prioCor(o.prioridade)}">${o.prioridade}</span></td>
              <td class="px-4 py-3"><span class="text-[10px] px-2 py-0.5 rounded-full font-semibold badge-${o.status==='em_execucao'?'execucao':o.status}">${statusLabelOs(o.status)}</span></td>
              <td class="px-4 py-3 text-xs text-[#acabaa]">${fmtData(o.criadoEm)}</td>
              <td class="px-4 py-3 text-center" onclick="event.stopPropagation()">
                <div class="flex items-center justify-center gap-1">
                  <button onclick="gerarNotaFiscal(${o.id})" title="Gerar Nota Fiscal" class="p-1 text-[#acabaa] hover:text-green-400 transition-colors"><span class="material-symbols-outlined text-base">receipt</span></button>
                  ${o.status !== 'finalizado' ? `<button onclick="abrirForm(${o.id})" title="Editar" class="p-1 text-[#acabaa] hover:text-[#ffb4ac] transition-colors"><span class="material-symbols-outlined text-base">edit</span></button>` : ''}
                </div>
              </td>
            </tr>`).join('') : `<tr><td colspan="8">${emptyState('Nenhuma OS encontrada.', 'build')}</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

async function abrirForm(id) {
  const os = id ? await DB.OS.buscar(id) : {};
  const [clientes, funcionarios] = await Promise.all([
    DB.Clientes.listar(),
    DB.Funcionarios.listar()
  ]);
  const optsCliente = [['', 'Selecione o cliente...'], ...(clientes || []).map(c => [String(c.id), c.nome])];
  const optsTecnico = [['', 'Nenhum'], ...(funcionarios || []).map(f => [String(f.id), f.nome])];
  pecasSelecionadasTemp = os.pecas ? [...os.pecas] : [];
  const statusAntigo = os.status || '';
  
  function renderPecasLista() {
    const container = document.getElementById('pecas-lista-container');
    if (!container) return;
    if (pecasSelecionadasTemp.length === 0) {
      container.innerHTML = '<div class="text-center py-4 text-[#acabaa] text-sm">Nenhuma peça adicionada.</div>';
      return;
    }
    container.innerHTML = `
      <div class="space-y-2">
        ${pecasSelecionadasTemp.map((p, idx) => `
          <div class="flex items-center justify-between bg-[#1f2020] rounded-lg px-3 py-2">
            <div class="flex-1">
              <div class="font-medium text-white text-sm">${esc(p.nome)}</div>
              <div class="text-xs text-[#acabaa]">${esc(p.sku)} | R$ ${p.preco.toFixed(2)}</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-sm text-white">${p.quantidade} un.</span>
              <button onclick="removerPecaTemp(${idx})" class="text-red-400 hover:text-red-300"><span class="material-symbols-outlined text-sm">delete</span></button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  const conteudo = `
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        ${select('Cliente', 'f-cliente', optsCliente, String(os.cliente_id || ''))}
        ${campo('Veículo', 'f-veiculo', 'text', os.veiculo||'')}
        ${campo('Placa', 'f-placa', 'text', os.placa||'')}
        ${campo('Serviço', 'f-servico', 'text', os.servico||'')}
        ${select('Técnico', 'f-tecnico', optsTecnico, String(os.tecnico_id || ''))}
        ${campo('Prazo', 'f-prazo', 'date', os.prazo||'')}
        ${select('Prioridade', 'f-prioridade', [['alta','Alta'],['media','Média'],['baixa','Baixa']], os.prioridade||'media')}
        ${select('Status', 'f-status', [['pendente','Pendente'],['em_execucao','Em Execução'],['finalizado','Finalizado'],['cancelado','Cancelado']], os.status||'pendente')}
      </div>
      ${textarea('Descrição', 'f-descricao', os.descricao||'')}
      
      <div class="border-t border-[#484848]/20 pt-4">
        <div class="flex items-center justify-between mb-3">
          <h4 class="text-sm font-semibold text-white">Peças Utilizadas</h4>
          <button type="button" onclick="abrirBuscaPecasSecundario()" class="flex items-center gap-1 text-xs bg-[#1f2020] hover:bg-[#252626] px-3 py-1.5 rounded-lg text-[#ffb4ac]">
            <span class="material-symbols-outlined text-sm">search</span> Adicionar Peça
          </button>
        </div>
        <div id="pecas-lista-container" class="min-h-[80px]"></div>
      </div>
    </div>
  `;

  abrirModal(id ? 'Editar OS' : 'Nova Ordem de Serviço', conteudo, async () => {
    const novoStatus = val('f-status');
    const cliente_id = parseInt(val('f-cliente'), 10);
    const tecnico_id = parseInt(val('f-tecnico'), 10) || null;
    const dados = {
      cliente_id, tecnico_id,
      veiculo: val('f-veiculo'), placa: val('f-placa'),
      servico: val('f-servico'), prazo: val('f-prazo'),
      prioridade: val('f-prioridade'), status: novoStatus, descricao: val('f-descricao'),
      pecas: pecasSelecionadasTemp
    };
    if (!cliente_id || !dados.servico) { toast('Cliente e serviço são obrigatórios.', 'err'); return false; }

    if (novoStatus === 'finalizado' && statusAntigo !== 'finalizado') {
      for (const p of pecasSelecionadasTemp) {
        const itemEstoque = await DB.Estoque.buscar(p.id);
        if (!itemEstoque) { toast(`Peça "${p.nome}" não encontrada.`, 'err'); return false; }
        if (itemEstoque.quantidade < p.quantidade) {
          toast(`Estoque insuficiente para "${p.nome}". Disponível: ${itemEstoque.quantidade}`, 'err');
          return false;
        }
      }
      for (const p of pecasSelecionadasTemp) {
        const itemEstoque = await DB.Estoque.buscar(p.id);
        await DB.Estoque.atualizar(p.id, { ...itemEstoque, quantidade: itemEstoque.quantidade - p.quantidade });
      }
      toast('OS finalizada e estoque atualizado!');
    }

    try {
      if (id) { await DB.OS.atualizar(id, dados); toast('OS atualizada!'); }
      else { await DB.OS.criar(dados); toast('OS criada!'); }
      render();
      return true;
    } catch (e) {
      toast(e.message || 'Erro ao salvar OS.', 'err');
      return false;
    }
  }, { wide: true, scroll: true });

  setTimeout(() => renderPecasLista(), 50);
  window.removerPecaTemp = (idx) => {
    pecasSelecionadasTemp.splice(idx, 1);
    renderPecasLista();
  };
  
  // Modal de busca de peças (agora com delegação de eventos e feedback visual)
  window.abrirBuscaPecasSecundario = () => {
    // Remove modal antigo se existir
    const modalExistente = document.getElementById('modal-busca-pecas');
    if (modalExistente) modalExistente.remove();
    
    let pecaSelecionadaId = null;
    let pecaSelecionadaNome = '';
    let pecaSelecionadaSku = '';
    let pecaSelecionadaPreco = 0;
    let pecaSelecionadaEstoque = 0;
    
    const modalDiv = document.createElement('div');
    modalDiv.id = 'modal-busca-pecas';
    modalDiv.className = 'fixed inset-0 z-[200] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
    modalDiv.innerHTML = `
      <div class="bg-[#131313] border border-[#484848]/30 rounded-xl w-full max-w-md shadow-2xl">
        <div class="flex items-center justify-between px-6 py-4 border-b border-[#484848]/20">
          <h3 class="font-bold text-white">Adicionar Peça</h3>
          <button id="fechar-modal-busca" class="text-[#acabaa] hover:text-white"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="p-6 space-y-4">
          <input type="text" id="busca-pecas-input" placeholder="Buscar por nome ou SKU..." class="w-full bg-black border border-[#484848]/40 rounded-lg px-3 py-2 text-sm text-white focus:border-[#ffb4ac] focus:outline-none" />
          <div id="busca-pecas-resultados" class="space-y-2 max-h-64 overflow-y-auto"></div>
          <div class="flex gap-2">
            <input type="number" id="quantidade-peca" placeholder="Quantidade" value="1" min="1" class="w-28 bg-black border border-[#484848]/40 rounded-lg px-3 py-2 text-sm text-white"/>
            <div id="peca-selecionada-info" class="flex-1 text-sm text-[#acabaa] flex items-center"></div>
          </div>
          <button id="confirmar-add-peca" class="w-full bg-[#ffb4ac] text-[#86000c] font-bold py-2 rounded-lg hover:brightness-110" disabled>Adicionar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    
    const fecharModal = () => modalDiv.remove();
    modalDiv.querySelector('#fechar-modal-busca').onclick = fecharModal;
    modalDiv.addEventListener('click', e => { if (e.target === modalDiv) fecharModal(); });
    
    const inputBusca = modalDiv.querySelector('#busca-pecas-input');
    const resultadosDiv = modalDiv.querySelector('#busca-pecas-resultados');
    const qtdInput = modalDiv.querySelector('#quantidade-peca');
    const infoDiv = modalDiv.querySelector('#peca-selecionada-info');
    const confirmarBtn = modalDiv.querySelector('#confirmar-add-peca');
    
    // Atualiza a lista de resultados conforme a busca
    const atualizarResultados = async () => {
      const termo = inputBusca.value.toLowerCase();
      let lista = await DB.Estoque.listar();
      if (termo) lista = lista.filter(p => p.nome.toLowerCase().includes(termo) || p.sku.toLowerCase().includes(termo));
      if (lista.length === 0) {
        resultadosDiv.innerHTML = '<div class="text-center py-8 text-[#acabaa]">Nenhuma peça encontrada.</div>';
        return;
      }
      resultadosDiv.innerHTML = lista.map(p => `
        <div class="peca-item flex items-center justify-between bg-[#1f2020] rounded-lg px-3 py-2 cursor-pointer hover:bg-[#252626] transition-colors" data-id="${p.id}" data-nome="${esc(p.nome)}" data-sku="${esc(p.sku)}" data-preco="${p.preco}" data-estoque="${p.quantidade}">
          <div>
            <div class="font-medium text-white">${esc(p.nome)}</div>
            <div class="text-xs text-[#acabaa]">${esc(p.sku)} | Estoque: ${p.quantidade} | Preço: ${fmt(p.preco)}</div>
          </div>
          <button class="usar-peca-btn bg-[#ffb4ac] text-[#86000c] text-xs font-bold px-3 py-1 rounded-lg hover:brightness-110">Usar</button>
        </div>
      `).join('');
      
      // Remove qualquer destaque anterior
      document.querySelectorAll('.peca-item').forEach(el => el.classList.remove('peca-selecionada'));
      pecaSelecionadaId = null;
      infoDiv.innerHTML = '';
      confirmarBtn.disabled = true;
    };
    
    // Delegação de eventos: cliques nos botões "Usar" ou na div inteira
    resultadosDiv.addEventListener('click', (e) => {
      let targetDiv = e.target.closest('.peca-item');
      if (!targetDiv) return;
      
      const id = parseInt(targetDiv.dataset.id);
      const nome = targetDiv.dataset.nome;
      const sku = targetDiv.dataset.sku;
      const preco = parseFloat(targetDiv.dataset.preco);
      const estoque = parseInt(targetDiv.dataset.estoque);
      
      // Remove a classe de todos e adiciona no selecionado
      document.querySelectorAll('.peca-item').forEach(el => el.classList.remove('peca-selecionada'));
      targetDiv.classList.add('peca-selecionada');
      
      pecaSelecionadaId = id;
      pecaSelecionadaNome = nome;
      pecaSelecionadaSku = sku;
      pecaSelecionadaPreco = preco;
      pecaSelecionadaEstoque = estoque;
      infoDiv.innerHTML = `<span class="text-white">${nome}</span> (max ${estoque})`;
      confirmarBtn.disabled = false;
    });
    
    inputBusca.addEventListener('input', atualizarResultados);
    atualizarResultados();
    
    confirmarBtn.onclick = () => {
      const quantidade = parseInt(qtdInput.value) || 1;
      if (!pecaSelecionadaId) { toast('Selecione uma peça.', 'err'); return; }
      if (quantidade < 1) { toast('Quantidade inválida.', 'err'); return; }
      if (quantidade > pecaSelecionadaEstoque) { toast(`Estoque máximo: ${pecaSelecionadaEstoque}`, 'err'); return; }
      if (pecasSelecionadasTemp.some(p => p.id === pecaSelecionadaId)) {
        toast('Peça já adicionada. Remova a atual se quiser mudar quantidade.', 'err');
        return;
      }
      pecasSelecionadasTemp.push({
        id: pecaSelecionadaId,
        nome: pecaSelecionadaNome,
        sku: pecaSelecionadaSku,
        preco: pecaSelecionadaPreco,
        quantidade: quantidade
      });
      // Atualiza a lista no modal principal
      const listaContainer = document.getElementById('pecas-lista-container');
      if (listaContainer) {
        if (pecasSelecionadasTemp.length === 0) {
          listaContainer.innerHTML = '<div class="text-center py-4 text-[#acabaa] text-sm">Nenhuma peça adicionada.</div>';
        } else {
          listaContainer.innerHTML = `
            <div class="space-y-2">
              ${pecasSelecionadasTemp.map((p, idx) => `
                <div class="flex items-center justify-between bg-[#1f2020] rounded-lg px-3 py-2">
                  <div class="flex-1">
                    <div class="font-medium text-white text-sm">${esc(p.nome)}</div>
                    <div class="text-xs text-[#acabaa]">${esc(p.sku)} | R$ ${p.preco.toFixed(2)}</div>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="text-sm text-white">${p.quantidade} un.</span>
                    <button onclick="removerPecaTemp(${idx})" class="text-red-400 hover:text-red-300"><span class="material-symbols-outlined text-sm">delete</span></button>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
      }
      toast('Peça adicionada!');
      fecharModal();
    };
  };
}

async function gerarNotaFiscal(id) {
  const os = await DB.OS.buscar(id);
  if (!os) return;
  const clientes = await DB.Clientes.listar();
  const cliente = clientes.find(c => c.id === os.cliente_id) || clientes.find(c => c.nome === os.cliente) || { nome: os.cliente, cpfCnpj: '', endereco: '' };
  const valorPecas = (os.pecas || []).reduce((sum, p) => sum + (p.preco * p.quantidade), 0);
  let descricao = os.servico;
  if (os.pecas && os.pecas.length) {
    descricao += `\nPeças: ${os.pecas.map(p => `${p.quantidade}x ${p.nome}`).join(', ')}`;
  }
  if (os.descricao) descricao += `\n${os.descricao}`;
  
  const conteudo = `
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        ${campo('Cliente', 'f-cliente', 'text', cliente.nome)}
        ${campo('CPF/CNPJ', 'f-cpfcnpj', 'text', cliente.cpfCnpj || '')}
        ${campo('Endereço', 'f-endereco', 'text', cliente.endereco || '')}
        ${campo('OS Vinculada', 'f-os', 'text', os.numero, 'readonly')}
        ${campo('Data Emissão', 'f-data', 'date', new Date().toISOString().split('T')[0])}
        ${select('Status', 'f-status', [['emitida','Emitida'],['paga','Paga'],['cancelada','Cancelada']], 'emitida')}
      </div>
      ${textarea('Descrição do Serviço', 'f-descricao', descricao)}
      <div class="grid grid-cols-3 gap-4">
        ${campo('Valor Serviços (R$)', 'f-vservicos', 'number', 0, 'step="0.01" oninput="calcTotalNF()"')}
        ${campo('Valor Peças (R$)', 'f-vpecas', 'number', valorPecas, 'step="0.01" readonly')}
        ${campo('Desconto (R$)', 'f-desconto', 'number', 0, 'step="0.01" oninput="calcTotalNF()"')}
      </div>
      <div class="bg-[#93000e]/10 border border-[#ffb4ac]/20 rounded-lg p-3 flex items-center justify-between">
        <span class="text-sm font-bold text-[#acabaa]">TOTAL</span>
        <div class="flex items-center gap-2">
          <span class="text-[#acabaa] text-sm">R$</span>
          <input id="f-total" type="number" step="0.01" value="${valorPecas}" class="bg-transparent text-xl font-black text-[#ffb4ac] text-right w-32 focus:outline-none border-b border-[#ffb4ac]/30" readonly/>
        </div>
      </div>
    </div>
  `;
  
  window.calcTotalNF = function() {
    const s = parseFloat(document.getElementById('f-vservicos')?.value) || 0;
    const p = parseFloat(document.getElementById('f-vpecas')?.value) || 0;
    const d = parseFloat(document.getElementById('f-desconto')?.value) || 0;
    const total = Math.max(0, s + p - d);
    const totalField = document.getElementById('f-total');
    if (totalField) totalField.value = total.toFixed(2);
  };
  
  abrirModal('Emitir Nota Fiscal', conteudo, async () => {
    const dados = {
      cliente: val('f-cliente'), cpfCnpj: val('f-cpfcnpj'), endereco: val('f-endereco'),
      os: val('f-os'), dataEmissao: val('f-data'), descricaoServico: val('f-descricao'),
      status: val('f-status'),
      valorServicos: parseFloat(document.getElementById('f-vservicos').value) || 0,
      valorPecas: parseFloat(document.getElementById('f-vpecas').value) || 0,
      desconto: parseFloat(document.getElementById('f-desconto').value) || 0,
      total: parseFloat(document.getElementById('f-total').value) || 0,
    };
    if (!dados.cliente) { toast('Cliente é obrigatório.', 'err'); return false; }
    try {
      await DB.Notas.criar(dados);
      toast('Nota fiscal emitida com sucesso!');
      return true;
    } catch (e) {
      toast(e.message, 'err');
      return false;
    }
  });
  setTimeout(() => { if(window.calcTotalNF) window.calcTotalNF(); }, 50);
}

async function verDetalhes(id) {
  const os = await DB.OS.buscar(id);
  if (!os) return;
  let pecasHtml = '';
  if (os.pecas && os.pecas.length) {
    pecasHtml = `<div class="pt-2 border-t border-[#484848]/20"><p class="text-[10px] text-[#acabaa] uppercase mb-1">Peças Utilizadas</p><table class="w-full text-xs"><thead><tr><th class="text-left">Peça</th><th class="text-left">SKU</th><th class="text-right">Qtd</th><th class="text-right">Preço</th><th class="text-right">Total</th></tr></thead><tbody>${
      os.pecas.map(p => `<tr><td class="text-left">${esc(p.nome)}</td><td class="text-left">${esc(p.sku)}</td><td class="text-right">${p.quantidade}</td><td class="text-right">R$ ${p.preco.toFixed(2)}</td><td class="text-right">R$ ${(p.preco * p.quantidade).toFixed(2)}</td></tr>`).join('')
    }</tbody></table></div>`;
  }
  abrirModal(`Detalhes — ${os.numero}`, `
    <div class="space-y-3 text-sm">
      <div class="grid grid-cols-2 gap-3">
        <div><p class="text-[10px] text-[#acabaa] uppercase">Cliente</p><p class="text-white font-semibold">${esc(os.cliente)}</p></div>
        <div><p class="text-[10px] text-[#acabaa] uppercase">Veículo</p><p class="text-white font-semibold">${esc(os.veiculo)} ${os.placa?'('+os.placa+')':''}</p></div>
        <div><p class="text-[10px] text-[#acabaa] uppercase">Serviço</p><p class="text-white">${esc(os.servico)}</p></div>
        <div><p class="text-[10px] text-[#acabaa] uppercase">Técnico</p><p class="text-white">${esc(os.tecnico)||'—'}</p></div>
        <div><p class="text-[10px] text-[#acabaa] uppercase">Status</p><p><span class="text-[10px] px-2 py-0.5 rounded-full font-semibold badge-${os.status==='em_execucao'?'execucao':os.status}">${statusLabelOs(os.status)}</span></p></div>
        <div><p class="text-[10px] text-[#acabaa] uppercase">Prioridade</p><p class="text-white capitalize">${os.prioridade}</p></div>
        ${os.prazo?`<div><p class="text-[10px] text-[#acabaa] uppercase">Prazo</p><p class="text-white">${fmtData(os.prazo)}</p></div>`:''}
        <div><p class="text-[10px] text-[#acabaa] uppercase">Criado em</p><p class="text-white">${fmtData(os.criadoEm)}</p></div>
      </div>
      ${os.descricao?`<div class="pt-2 border-t border-[#484848]/20"><p class="text-[10px] text-[#acabaa] uppercase mb-1">Descrição</p><p class="text-white">${esc(os.descricao)}</p></div>`:''}
      ${pecasHtml}
    </div>`, () => true);
  document.getElementById('salvar-modal').textContent = 'Fechar';
  document.getElementById('cancelar-modal').style.display = 'none';
  document.getElementById('salvar-modal').onclick = () => document.getElementById('modal-emu').remove();
}

async function excluir(id) {
  const os = await DB.OS.buscar(id);
  if (!os || !confirmar(`Excluir ${os.numero}?`)) return;
  try {
    await DB.OS.excluir(id);
    toast('OS excluída.');
    render();
  } catch (e) { toast(e.message, 'err'); }
}

render().catch(console.error);
</script>
</body>
</html>
